<!doctype html>
<html lang="en" style="background-color: #08070d; color: #f0edf7; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroBleed Auditor</title>
    <meta name="description" content="A need-to-know context broker for agentic audits and incident triage, built on Zetaris, Meterless Nightshift and the Markovian engine." />
    <meta property="og:title" content="ZeroBleed Auditor" />
    <meta property="og:description" content="A need-to-know context broker for agentic audits and incident triage, built on Zetaris, Meterless Nightshift and the Markovian engine." />
    <style>
      html, body {
        background-color: #08070d;
        color: #f0edf7;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        color-scheme: dark;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @keyframes zbPulse {
        0%, 100% { opacity: 0.6; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1); }
      }
      .premount-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 16px;
        background: radial-gradient(1000px 500px at 50% 0%, #171222 0%, #08070d 70%);
      }
      .premount-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid #2a2236;
        border-top-color: #d6f588;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#08070d] text-[#f0edf7] antialiased selection:bg-[#d6f588] selection:text-[#08070d]">
    <div id="root">
      <div class="premount-loader">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:32px;height:32px;border-radius:8px;background:#232b12;border:1px solid rgba(214,245,136,0.4);display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d6f588" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <span style="font-size:18px;font-weight:600;letter-spacing:-0.01em;color:#f0edf7;">
            <span style="color:#d6f588;">Zero</span>Bleed
          </span>
        </div>
        <div class="premount-spinner"></div>
        <span style="font-size:12px;font-family:'JetBrains Mono',monospace;color:#aaa4b8;letter-spacing:0.05em;text-transform:uppercase;">
          Initializing Context Firewall...
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
